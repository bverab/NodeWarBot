name: CI

on:
  push:
  pull_request:

# Solo lectura del repositorio; este flujo no usa secretos.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Las acciones estan fijadas por SHA (version indicada en el comentario).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # La version de pnpm sale del campo "packageManager" de package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # La version de Node sale de .nvmrc.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Los scripts de instalacion de Prisma estan denegados: el cliente se genera aparte.
      - name: Generar el cliente de Prisma
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck del dashboard
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      # Valores ficticios: el build no se conecta a nada, solo evita fallos por variables ausentes.
      - name: Build del dashboard
        run: pnpm dashboard:build
        env:
          DATABASE_URL: file:../data/ci.db
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder-secret
          DISCORD_CLIENT_ID: ci-placeholder
          DISCORD_CLIENT_SECRET: ci-placeholder
          DISCORD_BOT_TOKEN: ci-placeholder
